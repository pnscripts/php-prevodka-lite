name: CI

# Every push to main and every pull request. A library commits no
# composer.lock, so each run resolves the newest versions the constraints
# allow: what a new install gets.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new PHPUnit release is tried even when nothing here changed.
    - cron: '0 5 * * 1'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # A hung step (network, installer) stops here, not after GitHub's 6 hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The package needs PHP 8.2 or newer: 8.2 resolves PHPUnit 11, 8.4
        # PHPUnit 12.
        php: ['8.2', '8.4']
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # The library needs dom and mbstring; the tests validate every file
          # against the ISO 20022 schema with dom.
          extensions: dom, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Composer audit
        run: composer audit
      - name: Tests
        run: vendor/bin/phpunit
